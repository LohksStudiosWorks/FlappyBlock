name: Build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-pc:
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      
      - name: Setup and Build Release
        uses: LunarisLib/actions/SetupBuildSDL3@revamp
      
      - name: Upload build (under Release for Windows)
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v7
        with:
          name: UPLOAD_${{ matrix.os }}
          path: build/bin/executable/Release

      - name: Upload build (default path)
        if: matrix.os != 'windows-latest'
        uses: actions/upload-artifact@v7
        with:
          name: UPLOAD_${{ matrix.os }}
          path: build/bin/executable

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install NDK and Build Tools
        run: |
          # Calls sdkmanager to install requirements
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;28.2.13676358" "cmake;4.1.2"

      - name: Decode Release Keystore
        run: |
          # Decode base64 key of the project to keys
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 --decode > android-project/release-key.jks

      - name: Run build
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          # Build APK and AAR (if one day we go to the Play Store ;P)
          chmod +x android_build_release.sh
          ./android_build_release.sh

          mkdir -p _release
          # Disabled AAB because it is not needed for now
          #cp android-project/app/build/outputs/bundle/release/*.aab _release/release.aab
          cp android-project/app/build/outputs/apk/release/*.apk _release/release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: UPLOAD_APK
          path: |
            _release/release.apk

      #- name: Upload AAB
      #  uses: actions/upload-artifact@v7
      #  with:
      #    name: UPLOAD_AAB
      #    path: |
      #      _release/release.aab

  release:
    needs: [build-pc, build-android]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Make Release
        uses: LunarisLib/actions/Release@revamp