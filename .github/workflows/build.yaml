name: Build

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: linux-x86_64
            name: Ubuntu Latest x64
          - os: macos-latest
            artifact: macos-arm64
            name: macOS Latest ARM64
          - os: windows-latest
            artifact: windows-x86_64
            name: Windows Latest x64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install dependencies
        uses: $/.github/actions/setup

      - name: CMake configure and build
        uses: $/.github/actions/compile

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: |
            build/bin/executable

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@v6

      - name: Install Android NDK
        uses: android-actions/setup-android@v4

      - name: Install NDK and Build Tools
        run: |
          # Calls sdkmanager to install requirements
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;28.2.13676358" "cmake;4.1.2"

      - name: Decode Release Keystore
        run: |
          # Decode base64 key of the project to keys
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 --decode > android-project/release-key.jks

      - name: Run build
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          # Build APK and AAR (if one day we go to the Play Store ;P)
          chmod +x android_build_release.sh
          ./android_build_release.sh

          mkdir -p _release
          cp android-project/app/build/outputs/apk/release/*.apk _release/release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: Android-APK
          path: |
            _release/release.apk