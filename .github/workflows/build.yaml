name: Build

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: linux-x86_64
            name: Ubuntu Latest x64
          - os: macos-latest
            artifact: macos-arm64
            name: macOS Latest ARM64
          - os: windows-latest
            artifact: windows-x86_64
            name: Windows Latest x64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Bundle things up!
        uses: LohksStudiosWorks/SDL3_plus/actions/fullBuild@master
        with:
          target_name: FlappyBlock
          keystore_base64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          keystore_password: ${{ secrets.KEYSTORE_PASSWORD }}
          key_alias: ${{ secrets.KEY_ALIAS }}
          key_password: ${{ secrets.KEY_PASSWORD }}
          release_keys_file_path: resources/release-key.jks