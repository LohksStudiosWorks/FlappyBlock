name: 'Setup dependencies (compiler, libraries)'
description: 'Sets things up prior to compilation on all major platforms'

runs:
  using: composite
  steps:

  # ------------------------------
  # >> Linux
  # ------------------------------

    - name: Setup Linux
      if: runner.os == 'Linux'
      shell: bash
      run: |
        # APT update and install of dependencies

        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          cmake \
          ninja-build \
          pkg-config \
          ca-certificates \
          libasound2-dev \
          libpulse-dev \
          libpipewire-0.3-dev \
          libjack-dev \
          libsndio-dev \
          libx11-dev \
          libxext-dev \
          libxrandr-dev \
          libxcursor-dev \
          libxfixes-dev \
          libxi-dev \
          libxss-dev \
          libxtst-dev \
          libxinerama-dev \
          libxv-dev \
          libxxf86vm-dev \
          libxrender-dev \
          libxkbcommon-dev \
          libxkbcommon-x11-dev \
          libx11-xcb-dev \
          libxcb-randr0-dev \
          libxcb-shape0-dev \
          libxcb-xfixes0-dev \
          libxcb-xkb-dev \
          libxcb-shm0-dev \
          libxcb-sync-dev \
          libxcb-dri3-dev \
          libwayland-dev wayland-protocols \
          libdecor-0-dev \
          libdrm-dev \
          libgbm-dev \
          libgl1-mesa-dev \
          libgles2-mesa-dev \
          libegl1-mesa-dev \
          libvulkan-dev \
          libdbus-1-dev \
          libibus-1.0-dev \
          libudev-dev \
          libusb-1.0-0-dev \
          libthai-dev \
          libfribidi-dev \
          liburing-dev

  # ------------------------------
  # >> macOS
  # ------------------------------

    - name: Setup macOS
      if: runner.os == 'macOS'
      shell: bash
      run: |
        # Brew update and install of dependencies

        brew update
        brew install pkgconf ninja libusb vulkan-headers vulkan-loader molten-vk

  # ------------------------------
  # >> Windows
  # ------------------------------

    - name: Cache vcpkg artifacts
      uses: actions/cache@v6
      if: runner.os == 'Windows'
      with:
        path: |
          ${{ env.RUNNER_TEMP }}/vcpkg/installed
        key: vcpkg-${{ runner.os }}-
        restore-keys: |
          vcpkg-${{ runner.os }}-

    - name: Setup Windows MSVC
      uses: ilammy/msvc-dev-cmd@v1
      if: runner.os == 'Windows'

    - name: Setup Windows Dependencies (MSVC)
      if: runner.os == 'Windows'
      shell: bash
      run: |
        # VCPKG update and install of dependencies

        export vcpkgRoot="$RUNNER_TEMP/vcpkg"
        git clone --depth 1 https://github.com/microsoft/vcpkg.git "$vcpkgRoot"
        "$vcpkgRoot/bootstrap-vcpkg.sh" -disableMetrics
        "$vcpkgRoot/vcpkg" install --triplet x64-windows-static \
          bzip2 \
          libflac \
          libusb \
          vulkan \
          zlib \
          brotli \
          nghttp2 \
          libidn2 \
          freetype \
          harfbuzz \
          libpng \
          libwebp \
          tiff \
          libjpeg-turbo \
          libogg \
          libpsl[libicu] \
          libtheora \
          libvorbis \
          minimp3 \
          openal-soft \
          opus \
          opusfile \
          directxsdk

        echo "VCPKG_ROOT=$vcpkgRoot" >> $GITHUB_ENV
        choco install ninja --no-progress

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.14'
        cache: 'pip'

    - name: Install Python dependencies
      shell: bash
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then
          pip install -r requirements.txt
        fi