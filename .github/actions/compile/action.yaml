name: 'Build project'
description: 'CMake config and build'

runs:
  using: composite
  steps:      
    - name: CMake cache
      uses: actions/cache@v6
      with:
        path: build/_deps
        key: cmake-deps-${{ runner.os }}-${{ hashFiles('**/CMakeLists.txt') }}
        restore-keys: |
          cmake-deps-${{ runner.os }}-

    - name: CMake configure
      shell: bash
      run: |
        # Setting up CMake and doing first config

        EXTRA_ARGS=""
        VCPKG_CMAKE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"

        if [ -f "$VCPKG_CMAKE" ]; then
          EXTRA_ARGS="-DCMAKE_TOOLCHAIN_FILE=$VCPKG_CMAKE -DVCPKG_TARGET_TRIPLET=x64-windows-static"
          echo "Enabled VCPKG correctly"
        else
          echo "No VCPKG config found!"
        fi

        cmake -S . -B build -G Ninja \
          -DCMAKE_BUILD_TYPE=Release $EXTRA_ARGS

    - name: CMake build
      shell: bash
      run: |
        # CMake build

        cmake --build build --config Release --parallel
        